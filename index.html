<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Viaggio</title>

  <!-- viewport-fit=cover: la pagina usa tutto lo schermo dell'iPhone, anche dietro
       la tacca. Gli spazi di rispetto li aggiunge il CSS con le "safe area". -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Spese, convertitore di valuta e itinerario del viaggio. Funziona anche offline.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#7b2242" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#221b1e" media="(prefers-color-scheme: dark)">

  <!-- Il manifest descrive l'app a chi la installa: nome, icone, colori. -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Istruzioni specifiche per l'iPhone quando l'app è sulla schermata Home:
       si apre a tutto schermo, con questo nome e questa icona. Con la barra di
       stato "black-translucent" la pagina arriva fino in cima e l'orologio è
       scritto in bianco: per questo la barra alta dell'app è sempre scura. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Viaggio">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- Evita che iOS trasformi i numeri (importi, orari) in link per telefonare. -->
  <meta name="format-detection" content="telephone=no">

  <!-- Stile della libreria per le mappe (Leaflet), copiata nel repository -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Barra in alto: titolo della schermata e, dentro un giorno, la freccia per tornare indietro -->
  <header class="barra-alta">
    <a class="indietro" id="indietro" href="#/itinerario" aria-label="Indietro" hidden>‹</a>
    <h1 id="titolo">Viaggio</h1>
  </header>

  <!-- Compare solo quando è pronta una nuova versione dell'app -->
  <div id="avviso-aggiornamento" hidden>
    <span>Nuova versione disponibile</span>
    <button class="tasto-testo">Aggiorna</button>
  </div>

  <!-- Qui dentro JavaScript disegna la schermata scelta -->
  <main id="vista"></main>

  <!-- Barra in basso: le cinque schermate principali -->
  <nav class="barra-bassa" aria-label="Schermate">
    <a href="#/spese" data-scheda="spese">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
      <span>Spese</span>
    </a>
    <a href="#/cambio" data-scheda="cambio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h15l-3.5-3.5M20 16H5l3.5 3.5"/></svg>
      <span>Cambio</span>
    </a>
    <a href="#/itinerario" data-scheda="itinerario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>Itinerario</span>
    </a>
    <a href="#/mappa" data-scheda="mappa">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5a7 7 0 1 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>Mappa</span>
    </a>
    <a href="#/impostazioni" data-scheda="impostazioni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="3"/><circle cx="8" cy="17" r="3"/></svg>
      <span>Impostazioni</span>
    </a>
  </nav>

  <!-- Messaggi brevi ("Spesa salvata") -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- type="module": il codice è diviso in più file che si importano a vicenda -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
