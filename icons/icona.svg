<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icona dell'app: un grappolo d'uva (la vendemmia) su fondo bordeaux.
       Il disegno sta tutto nella zona centrale, così iOS e Android possono
       arrotondare o ritagliare i bordi senza tagliarlo. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93294f"/>
      <stop offset="1" stop-color="#5a1730"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>

  <!-- picciolo e foglia -->
  <path d="M256 196 C256 160 262 140 286 122" fill="none" stroke="#f7e9dc" stroke-width="16" stroke-linecap="round"/>
  <path d="M286 150 C318 112 372 116 392 150 C360 184 314 182 286 150 Z" fill="#b5cf8f"/>

  <!-- acini: file da 3, 2 e 1 -->
  <g fill="#f7e9dc">
    <circle cx="164" cy="236" r="44"/>
    <circle cx="256" cy="236" r="44"/>
    <circle cx="348" cy="236" r="44"/>
    <circle cx="210" cy="316" r="44"/>
    <circle cx="302" cy="316" r="44"/>
    <circle cx="256" cy="396" r="44"/>
  </g>
</svg>
